<script>
  async function searchHotels() {
    const city = document.getElementById('cityInput').value; // Apne input field ka ID match kar lena
    const resultsContainer = document.getElementById('results'); // Apne results div ka ID
    
    if (!city) {
      alert("Please enter a city name!");
      return;
    }

    resultsContainer.innerHTML = "<p>Searching hotels for " + city + "...</p>";

    try {
      const response = await fetch(`/api/hotels?city=${city}`);
      const data = await response.json();

      if (data.error) {
        resultsContainer.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
        return;
      }

      // Hotels.com API se data extract karne ka naya logic
      let hotels = [];
      if (data.properties) {
        hotels = data.properties;
      } else if (data.data && data.data.properties) {
        hotels = data.data.properties;
      } else {
        resultsContainer.innerHTML = "<p>No hotels found for this city.</p>";
        return;
      }

      let html = "";
      
      hotels.forEach(hotel => {
        // Hotels.com ke naye JSON tags
        const name = hotel.name || "Luxury Hotel";
        const price = hotel.price?.lead?.formatted || hotel.price?.lead?.amount || "Check Price";
        const image = hotel.propertyImage?.image?.url || "https://via.placeholder.com/300x200?text=No+Image";
        
        // WhatsApp Redirect Setup
        const waNumber = "91XXXXXXXXXX"; // Yahan apna WhatsApp number daal dena
        const waMessage = `Hi Sheet Holidays, I want to book ${name} in ${city}. Price showing: ${price}`;
        const waLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(waMessage)}`;

        // UI Card Generate karna
        html += `
          <div class="hotel-card" style="border:1px solid #ddd; border-radius:8px; padding:15px; margin-bottom:15px; text-align:left;">
            <img src="${image}" style="width:100%; height:200px; object-fit:cover; border-radius:5px;" alt="Hotel Image">
            <h3 style="margin-top:10px;">${name}</h3>
            <p style="font-weight:bold; color:#e53935;">Price: ${price}</p>
            <a href="${waLink}" target="_blank" style="display:inline-block; background-color:#25D366; color:white; padding:10px 15px; text-decoration:none; border-radius:5px; font-weight:bold;">
              Book via WhatsApp
            </a>
          </div>
        `;
      });

      resultsContainer.innerHTML = html;

    } catch (error) {
      console.error("Frontend Error:", error);
      resultsContainer.innerHTML = "<p style='color:red;'>Server Connection Error!</p>";
    }
  }
</script>
